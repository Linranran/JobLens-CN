[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "joblens-cn"
version = "0.1.0"
description = "Local-first company-job intelligence and explainable matching for Chinese tech candidates"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Linranran"}]
keywords = ["job-search", "career", "job-matching", "job-intelligence", "resume", "china"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit>=1.40"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
joblens = "joblens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
joblens = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
